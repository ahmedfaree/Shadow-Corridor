<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Shadow Corridor</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050608;color:white;font-family:Arial;overflow:hidden}
#game{height:100vh;position:relative;overflow:hidden;background:radial-gradient(ellipse at center,#41464a,#111518 55%,#000)}
.hall{position:absolute;inset:0;background:linear-gradient(90deg,#000 0 12%,transparent 30% 70%,#000 88%),linear-gradient(#090b0d,#30353a 50%,#090a0b);clip-path:polygon(15% 0,85% 0,100% 100%,0 100%)}
.floor{position:absolute;bottom:0;width:100%;height:42%;background:repeating-linear-gradient(0deg,#101316 0 3px,#252a2e 4px 5px)}
.door{position:absolute;top:23%;width:17%;height:42%;border:8px solid #08090b;background:#171b1e}
.left{left:15%}.right{right:15%}
#monster{position:absolute;top:28%;left:50%;transform:translateX(-50%);font-size:100px;opacity:0;filter:drop-shadow(0 0 20px red)}
#hud{position:absolute;top:12px;left:10px;right:10px;display:flex;justify-content:space-between}
.panel{background:#080a0ddd;padding:10px;border:1px solid #777;border-radius:8px}
#msg{position:absolute;top:17%;width:100%;text-align:center;font-size:19px;text-shadow:0 2px 5px black}
#controls{position:absolute;bottom:20px;width:100%;display:flex;justify-content:space-around}
button{background:#191d22;color:white;border:1px solid #999;border-radius:12px;padding:16px;font-size:20px}
#overlay{position:absolute;inset:0;background:#000e;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:5}
h1{color:#eee;text-shadow:0 0 20px red}
#start{background:#791515;padding:15px 35px}
</style>
</head>
<body>
<div id="game">
<div class="hall"></div>
<div class="floor"></div>
<div class="door left"></div>
<div class="door right"></div>
<div id="monster">👹</div>

<div id="hud">
<div class="panel">المفاتيح: <span id="keys">0/3</span></div>
<div class="panel">الصحة: <span id="hp">100</span>%</div>
</div>

<div id="msg">اجمع المفاتيح واهرب من الظل!</div>

<div id="controls">
<button onclick="move(-1)">◀</button>
<button onclick="run()">🏃</button>
<button onclick="move(1)">▶</button>
<button onclick="collect()">🔑</button>
</div>

<div id="overlay">
<h1>SHADOW CORRIDOR</h1>
<p>أنت داخل مستشفى مهجور. اجمع المفاتيح الثلاثة، وتجنب الوحش، وابحث عن باب الخروج.</p>
<button id="start" onclick="startGame()">ابدأ اللعبة</button>
</div>
</div>

<script>
let keys=0,hp=100,pos=0,active=false,chase=0,timer;

function update(){
document.getElementById("keys").textContent=keys+"/3";
document.getElementById("hp").textContent=hp;
document.getElementById("monster").style.opacity=
chase>30?Math.min(1,(chase-30)/40):0;
}

function say(text){
document.getElementById("msg").textContent=text;
}

function startGame(){
keys=0;hp=100;pos=0;chase=0;active=true;
document.getElementById("overlay").style.display="none";
say("تحرك بحذر... هناك شيء يراقبك!");
update();

clearInterval(timer);
timer=setInterval(()=>{
if(!active)return;
chase+=Math.random()*5+2;

if(chase>90){
hp-=15;
chase=50;
say("الوحش يقترب منك! اهرب!");
}
if(hp<=0)finish(false);
update();
},1200);
}

function move(n){
if(!active)return;
pos=Math.max(0,Math.min(15,pos+n));
chase+=n>0?3:1;

if([3,7,12].includes(pos)){
say("تسمع صوت مفتاح... اضغط زر المفتاح!");
}else if(pos>=15){
if(keys===3)finish(true);
else say("الباب مغلق! تحتاج إلى المفاتيح الثلاثة");
}else{
say("أنت تتقدم داخل الممر المظلم...");
}
update();
}

function run(){
move(2);
move(2);
}

function collect(){
if(!active)return;
if([3,7,12].includes(pos)){
keys++;
pos+=0.2;
say("حصلت على مفتاح!");
}else{
say("لا يوجد مفتاح في هذا المكان");
}
if(keys===3)say("جمعت المفاتيح! اركض إلى باب الخروج!");
update();
}

function finish(win){
active=false;
clearInterval(timer);
document.getElementById("overlay").style.display="flex";
document.getElementById("overlay").innerHTML=
"<h1>"+(win?"لقد نجوت!":"انتهت اللعبة")+"</h1>"+
"<p>"+(win?"نجحت في الهروب من الممر المظلم!":"الظل أمسك بك... حاول مرة أخرى.")+"</p>"+
'<button id="again">العب مرة أخرى</button>';
document.getElementById("again").onclick=startGame;
}

document.addEventListener("keydown",e=>{
if(e.key==="ArrowLeft")move(-1);
if(e.key==="ArrowRight")move(1);
if(e.key===" ")run();
if(e.key==="Enter")collect();
});
</script>
</body>
</html>
